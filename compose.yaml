services:
  # ─────────────────────────────────────────────────────────────────
  # TODO student: adaugă aici serviciul `app`
  #
  # Cerințe:
  #   - image: <username-ul-tau-docker-hub>/elevix-api:1.0.0
  #     (înlocuiește placeholder-ul cu username-ul tău real)
  #   - build: context . dockerfile Dockerfile  (fallback dacă imaginea lipsește)
  #   - container_name: elevix-app
  #   - ports: 8082:8082
  #   - environment:
  #       DB_URL: jdbc:mysql://mysql:3306/elevix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
  #       SHOW_SQL: "false"
  #     ↑ host = "mysql" (DNS-ul service-ului din compose, NU localhost)
  #       SHOW_SQL false ca să nu inunde log-ul cu SQL
  #   - depends_on: mysql cu condition: service_healthy
  #   - restart: unless-stopped
  # ─────────────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.4
    container_name: elevix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: elevix_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
